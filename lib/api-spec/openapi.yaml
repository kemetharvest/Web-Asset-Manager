openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Egypt Results Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: results
    description: Student result operations
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /results/{seatNumber}:
    get:
      operationId: getResultBySeat
      tags: [results]
      summary: Get student result by seat number
      parameters:
        - name: seatNumber
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Student found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /results/search:
    get:
      operationId: searchByName
      tags: [results]
      summary: Search students by name (partial match)
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: number
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 20
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentSearchResult"

  /admin/status:
    get:
      operationId: getDataStatus
      tags: [admin]
      summary: Get data loading status (public)
      responses:
        "200":
          description: Data status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataStatus"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminToken"
        "401":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/upload:
    post:
      operationId: adminUpload
      tags: [admin]
      summary: Upload Excel file with student data (multipart/form-data, use custom fetch)
      responses:
        "200":
          description: Upload successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/data:
    delete:
      operationId: deleteData
      tags: [admin]
      summary: Delete all student data
      responses:
        "200":
          description: Data deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get data statistics
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Student:
      type: object
      required: [seatNumber, arabicName, totalDegree, studentCaseDesc]
      properties:
        seatNumber:
          type: number
        arabicName:
          type: string
        totalDegree:
          type: number
        studentCaseDesc:
          type: string

    StudentSummary:
      type: object
      required: [seatNumber, arabicName, totalDegree, studentCaseDesc]
      properties:
        seatNumber:
          type: number
        arabicName:
          type: string
        totalDegree:
          type: number
        studentCaseDesc:
          type: string

    StudentSearchResult:
      type: object
      required: [students, total, page, limit]
      properties:
        students:
          type: array
          items:
            $ref: "#/components/schemas/StudentSummary"
        total:
          type: number
        page:
          type: number
        limit:
          type: number

    AdminCredentials:
      type: object
      required: [password]
      properties:
        password:
          type: string

    AdminToken:
      type: object
      required: [token]
      properties:
        token:
          type: string

    UploadResult:
      type: object
      required: [count, message]
      properties:
        count:
          type: number
        message:
          type: string

    DeleteResult:
      type: object
      required: [message]
      properties:
        message:
          type: string

    AdminStats:
      type: object
      required: [totalStudents, averageScore, highestScore, lowestScore, passedCount, failedCount, loaded]
      properties:
        totalStudents:
          type: number
        averageScore:
          type: number
        highestScore:
          type: number
        lowestScore:
          type: number
        passedCount:
          type: number
        failedCount:
          type: number
        loaded:
          type: boolean

    DataStatus:
      type: object
      required: [loaded, count]
      properties:
        loaded:
          type: boolean
        count:
          type: number

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
